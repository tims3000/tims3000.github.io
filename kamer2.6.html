<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/juwelierwinkel.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

.scanner {
    width: 200px;
    cursor: pointer;
    transition: transform 0.2s;
}

.scanner:hover {
    transform: scale(1.05);
}
    </style>
</head>
<body>

    <a href="kamer2.1.html" class="terug-knop">Terug</a>

<img src="img/scanner.png" alt="Scanner" class="scanner" id="scanner">

</body>

<script>
document.addEventListener("DOMContentLoaded", function() {

    document.getElementById("scanner").addEventListener("click", function() {

        let opgeslagenNummer = localStorage.getItem("toegangCode");

        if(opgeslagenNummer === "4") {
            // Goed pasje → volgende pagina
            window.location.href = "kamer2.7.html";
        } else {
            // Fout pasje
            alert("❌ Dit pasje werkt niet! Het moet wel een pasje zijn van iemand die daar werkt.");
        }

    });

});
</script>

</html>
