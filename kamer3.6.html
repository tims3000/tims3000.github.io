<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/roodjuweel.png') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
}

.juwelen-container {
    display: grid;
    grid-template-columns: repeat(5, 120px);
    grid-template-rows: repeat(2, 120px);
    gap: 20px;
    justify-content: center;
    margin-bottom: 180px;
}

.juweel {
    width: 110px;
    height: 110px;
    cursor: pointer;
    transition: transform 0.2s;
}

.juweel:hover {
    transform: scale(1.2);
}

.slots {
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
}

.slot {
    width:120px;
    height:120px;
    border:2px solid rgba(255,255,255,0.6);
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
}

.slot img {
    width:110px;
    cursor:pointer;
}

.empty-slot {
    opacity: 0;
}

.verder-knop {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.6);
    color: #f5f5f5;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    border-radius: 5px;
    transition: background 0.3s;
}

.verder-knop:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 3px;
    border-radius: 6px;
    max-width: 1200px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    line-height: 1.1;
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<a href="kamer3.1.html" class="terug-knop">Terug</a>

<a href="kamer3.7.html" class="verder-knop">Verder</a>

<div class="juwelen-container" id="juwelen"></div>

<div class="slots">
    <div class="slot" data-slot="0"></div>
    <div class="slot" data-slot="1"></div>
    <div class="slot" data-slot="2"></div>
</div>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
const juwelenContainer = document.getElementById("juwelen");
const slots = document.querySelectorAll(".slot");

let gekozen = JSON.parse(localStorage.getItem("juwelenSlots")) || [null,null,null];

function save() {
    localStorage.setItem("juwelenSlots", JSON.stringify(gekozen));
}

function eersteVrijeSlot() {
    return gekozen.indexOf(null);
}

function maakJuwelen() {
    juwelenContainer.innerHTML = "";

    for(let i=1; i<=10; i++) {
        const img = document.createElement("img");
        img.src = `img/juweel${i}.png`;
        img.className = "juweel";

        if(gekozen.includes(i)) {
            img.classList.add("empty-slot");
        }

        img.onclick = () => {
            let slot = eersteVrijeSlot();
            if(slot === -1 || gekozen.includes(i)) return;

            gekozen[slot] = i;
            save();
            render();
        }

        juwelenContainer.appendChild(img);
    }
}

function renderSlots() {
    slots.forEach((slot,index) => {
        slot.innerHTML = "";

        if(gekozen[index] != null) {
            const img = document.createElement("img");
            img.src = `img/juweel${gekozen[index]}.png`;

            img.onclick = () => {
                gekozen[index] = null;
                save();
                render();
            }

            slot.appendChild(img);
        }
    });
}

function render() {
    maakJuwelen();
    renderSlots();
}

render();

const uitlegTekst = "Eindelijk, je hebt de juwelen voor het grijpen. Het is het beste om de duurste te pakken, zodat je zoveel mogelijk kunt verdienen aan deze overval."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30);
    }
}

typeUitleg();
</script>

</body>
</html>
