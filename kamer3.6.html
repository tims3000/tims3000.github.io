<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/juwelierlaptop2.png') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
}

.juwelen-container{
    display: grid;
    grid-template-columns: repeat(5, 100px);
    grid-template-rows: repeat(2, 100px);
    gap: 20px;
    justify-content: center;
    margin-bottom: 150px; /* ruimte voor slots */
}

.juweel{
    width: 90px;
    height: 90px;
    cursor: pointer;
    transition: transform 0.2s;
}

.juweel:hover{
    transform: scale(1.2);
}

.slots{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:20px;
}

.slot{
    width:100px;
    height:100px;
    border:2px solid rgba(255,255,255,0.6);
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.5);
}

.slot img{
    width:90px;
    cursor:pointer;
}

</style>
</head>
<body>

<a href="kamer3.1.html" class="terug-knop">Terug</a>

<div class="juwelen-container" id="juwelen"></div>

<div class="slots">
    <div class="slot" data-slot="0"></div>
    <div class="slot" data-slot="1"></div>
    <div class="slot" data-slot="2"></div>
</div>

<script>

const juwelenContainer = document.getElementById("juwelen");
const slots = document.querySelectorAll(".slot");

let gekozen = JSON.parse(localStorage.getItem("juwelenSlots")) || [null,null,null];

function save(){
    localStorage.setItem("juwelenSlots", JSON.stringify(gekozen));
}

function eersteVrijeSlot(){
    return gekozen.indexOf(null);
}

function maakJuwelen(){

    for(let i=1;i<=10;i++){

        if(gekozen.includes(i)) continue;

        const img=document.createElement("img");
        img.src=`img/juweel${i}.png`;
        img.className="juweel";
        img.dataset.id=i;

        img.onclick=()=>{
            let slot=eersteVrijeSlot();
            if(slot===-1) return;

            gekozen[slot]=i;
            save();
            render();
        }

        juwelenContainer.appendChild(img);
    }
}

function renderSlots(){

    slots.forEach((slot,index)=>{

        slot.innerHTML="";

        if(gekozen[index]!=null){

            const img=document.createElement("img");
            img.src=`img/juweel${gekozen[index]}.png`;

            img.onclick=()=>{
                gekozen[index]=null;
                save();
                render();
            }

            slot.appendChild(img);
        }

    });

}

function render(){

    juwelenContainer.innerHTML="";
    maakJuwelen();
    renderSlots();

}

render();

</script>

</body>
</html>
