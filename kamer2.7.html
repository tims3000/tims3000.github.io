<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/binneninjuwelier.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }


.laptop {
    position: absolute;
    width: 150px;
    bottom: 25px;
    right: 350px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    color: #fff;
    text-decoration: none;
}

.laptop span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
}

.laptop img {
    width: 100%;
    height: auto;
}

        /* Vierkante knop rechtsonder */
        .next-button {
            position: fixed;
            bottom: 100px;
            right: 5px;
            width: 200px;
            height: 600px;
            background-color: rgba(255, 255, 255, 0.0);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

.diamant {
    position: absolute;

    top: 45%;     /* verticale positie aanpassen */
    left: 50%;    /* horizontale positie aanpassen */
    transform: translate(-50%, -50%);

    width: 175px; /* grootte aanpassen */
    height: auto;

    cursor: pointer;
}

.klok1039 {
    position: absolute;
    top: 175px;     /* verticale positie aanpassen */
    left: 425px;    /* horizontale positie aanpassen */
    border-radius: 100%;
    width: 115px; /* grootte aanpassen */
    height: auto;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
    </style>
</head>
<body>
      <button class="next-button" onclick="location.href='kamer2.9.html'"></button>

    <a href="kamer2.6.html" class="terug-knop">Terug</a>

<a href="kamer2.8.html" class="laptop">
    <img src="img/laptop.png" alt="folder">
    <span>Hacking Laptop</span>
</a>

<img src="img/diamant.png" id="diamant" class="diamant" alt="Diamant">

<img src="img/1039.png" class="klok1039">

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

</body>

<script>
    const diamant = document.getElementById("diamant");

    diamant.addEventListener("click", function() {

        const status = localStorage.getItem("schakelaarStatus2");

        if (status === "off") {
            // Firewall staat uit → je mag verder
            window.location.href = "kamer3.1.html";
        } else {
            // Firewall staat nog aan → alarm!
            alert("⚠ PAS OP! Nog één stap verder en het alarm was afgegaan!");
        }

    });

const uitlegTekst = "Oké, goed, je bent binnen. Zorg er nu voor dat je de juwelen veilig kunt pakken zonder de politie te alarmeren."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();
</script>

</html>
