<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/boss.jpg') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.6);
    color: #f5f5f5;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

.next-button {
    position: fixed;
    bottom: 310px;
    right: 540px;
    width: 20px;
    height: 50px;
    background-color: rgba(255, 255, 255, 0);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.next-button1 {
    position: fixed;
    bottom: 100px;
    right: 665px;
    width: 275px;
    height: 200px;
    background-color: rgba(255, 255, 255, 0);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#sleutel {
    position: absolute;
    bottom: 35px;
    left: 175px;
    width: 80px;
    height: auto;
    cursor: pointer;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 3px;
    border-radius: 6px;
    max-width: 1200px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    line-height: 1.1;
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<button class="next-button1" onclick="location.href='kamer2.11.html'"></button>

<button class="next-button" onclick="location.href='kamer2.10.html'"></button>

<a href="kamer2.7.html" class="terug-knop">Terug</a>

<img src="img/key.webp" id="sleutel">

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
document.getElementById("sleutel").onclick = function() {

    if(localStorage.getItem("heeftSleutel") === "ja"){
        alert("Je hebt deze sleutel al.");
    } else {
        localStorage.setItem("heeftSleutel", "ja");
        alert("Je hebt een sleutel gevonden!");
    }

}

const uitlegTekst = "Misschien kun je via deze computer de elektriciteit uitschakelen, omdat dit een bekend apparaat is bij de firewall. Maar eerst moet je het wachtwoord zoeken om überhaupt in de computer te komen."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30);
    }
}

typeUitleg();
</script>

</body>
</html>
