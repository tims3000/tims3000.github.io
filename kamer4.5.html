<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background-color: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-align: center;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
}

.knop {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: rgba(0,0,0,0.7);
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

.knop:hover {
    background: rgba(0,0,0,0.9);
}

#wachtwoordBox {
    margin-top: 20px;
    display: none;
}

input {
    padding: 10px;
    font-size: 16px;
}

#slagboom {
    font-size: 50px;
    margin-top: 40px;
}
</style>
</head>

<body>

<a href="kamer4.3.html" class="terug-knop">Terug</a>

<h1>Slagboom bedienen</h1>

<div id="slagboom">🟢 Open</div>

<button class="knop" onclick="toonWachtwoord()">Slagboom dicht doen</button>

<div id="wachtwoordBox">
    <p>Voer het wachtwoord in:</p>
    <input type="password" id="wachtwoord">
    <button class="knop" onclick="checkWachtwoord()">OK</button>
</div>

<p id="melding"></p>

<script>
function toonWachtwoord(){
    document.getElementById("wachtwoordBox").style.display = "block";
}

function checkWachtwoord(){
    let ww = document.getElementById("wachtwoord").value;
    let slagboom = document.getElementById("slagboom");
    let melding = document.getElementById("melding");

    if(ww === "Sp@rkie"){
        slagboom.textContent = "🔴 Dicht";
        melding.textContent = "Slagboom gaat dicht! De politie kan niet verder lekker gedaan";
        setTimeout(function(){
            window.location.href = "volgendepagina.html";
        },3000);
    }else{
        melding.textContent = "❌ Fout wachtwoord!";
    }
}
</script>

</body>
</html>
