<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/autolaptop.png') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-align: center;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.next-button1 {
    position: fixed;
    top: 50%;
    right: 40%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    background-color: rgba(255,255,255,0.5);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.next-button2 {
    position: fixed;
    top: 50%;
    left: 40%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    background-color: rgba(255,255,255,0.5);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

</style>
</head>

<body>

<a href="kamer4.2.html" class="terug-knop">Terug</a>
