<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/autolaptop.png') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-align: center;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.code-button1 {
    position: fixed;
    bottom: 230px;
    right: 35%;
    transform: translateX(50%); /* Alleen horizontaal centreren */
    width: 300px;
    height: 350px;
    background-color: rgba(255, 255, 255, 0.0);
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.code-button2 {
    position: fixed;
    bottom: 230px;
    left: 35%;
    transform: translateX(-50%); /* Horizontaal corrigeren vanaf rechts */
    width: 300px;
    height: 350px;
    background-color: rgba(255, 255, 255, 0.0);
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

</style>
</head>

<body>

<a href="kamer4.2.html" class="terug-knop">Terug</a>

<button class="code-button1" onclick="location.href='kamer4.4.html'"></button>

<button class="code-button2" onclick="location.href='kamer4.5.html'"></button>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

    <script>
const uitlegTekst = "Oké, je moet de slagboom hacken, maar hiervoor heb je eerst een wachtwoord nodig. Misschien staat er iets in de logs van het systeem."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();
    </script>

</body>
</html>
