<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/achtergrondlaptop.webp') no-repeat center center/cover;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* helemaal boven */
    align-items: flex-start;    /* helemaal links */
    padding: 0;                 /* geen padding zodat alles tegen de rand zit */
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    position: relative;         /* nodig voor absolute positioning van icon */
}

/* Icon styling */
#icon {
    position: absolute; /* zodat het helemaal linksboven staat */
    top: 0;
    left: 0;
    width: 150px;       /* pas grootte hier aan naar wens */
    height: auto;       /* houdt verhouding intact */
}
</style>
</head>
<body>

<img id="icon" src="img/icon.png" alt="Icon">

</body>
</html>
