<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/achtergrondlaptop.webp') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        .morse {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.morse-line {
    display: flex;
    gap: 8px;
}

.dot, .dash, .space {
    width: 30px;
    height: 30px;
}

.dot {
    background: url('img/morse.webp') no-repeat center/contain;
}

.dash {
    background: url('img/morse.webp') no-repeat center/contain;
}

.space {
    background: transparent;
}

    </style>
</head>
<body>

<div class="morse">

    <!-- Regel 1: D (-..) -->
    <div class="morse-line">
        <div class="dash"></div>
        <div class="dash"></div>
        <div class="dash"></div>

        <div class="space"></div>

        <div class="dot"></div>

        <div class="space"></div>

        <div class="dot"></div>
    </div>

    <!-- Regel 2: Q (--.-) -->
    <div class="morse-line">
        <div class="dash"></div>
        <div class="dash"></div>
        <div class="dash"></div>

        <div class="space"></div>

        <div class="dash"></div>
        <div class="dash"></div>
        <div class="dash"></div>

        <div class="space"></div>

        <div class="dot"></div>

        <div class="space"></div>

        <div class="dash"></div>
        <div class="dash"></div>
        <div class="dash"></div>
    </div>

    <!-- Regel 3: I (..) -->
    <div class="morse-line">
        <div class="dot"></div>

        <div class="space"></div>

        <div class="dot"></div>
    </div>

    <!-- Regel 4: G (--.) -->
    <div class="morse-line">
        <div class="dash"></div>
        <div class="dash"></div>
        <div class="dash"></div>

        <div class="space"></div>

        <div class="dash"></div>
        <div class="dash"></div>
        <div class="dash"></div>

        <div class="space"></div>

        <div class="dot"></div>
    </div>

</div>


</body>
</html>
