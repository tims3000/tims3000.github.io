<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/achtergrondlaptop.png') no-repeat center center/cover;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 0;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    position: relative;
}

/* Container voor icoon + tekst */
#plattegrond-container {
    position: absolute;
    top: 10px;       /* beetje afstand van de rand */
    right: 10px;
    text-align: center;
    cursor: pointer; /* laat zien dat het klikbaar is */
}

#plattegrond-container img {
    width: 75px;    /* pas grootte aan */
    height: auto;
}

#plattegrond-container span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
    color: #fff;
}

  #agendaList {
    display: none;
    margin-top: 20px;
    text-align: left;
    display: inline-block;
  }
  #agendaList li {
    margin-bottom: 8px;
  }
  .agendaButton {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.3s;
  }
  .agendaButton:hover {
    background-color: #45a049;
  }
</style>
</head>
<body>

<div id="plattegrond-container" onclick="checkPassword()">
    <img src="img/plattegrond.png" alt="Plattegrond">
    <span>Bouw Plattegrond Juwelier</span>
</div>

<img src="filemap.png" alt="Filemap">
<div class="agendaButton" onclick="toggleAgenda()">Agenda</div>

<ul id="agendaList">
  <li>Ontbijt met team</li>
  <li>Morsecode leren</li>
  <li>Escape room voorbereiding</li>
  <li>Lunchpauze</li>
  <li>Testen van puzzels</li>
  <li>Feedbacksessie</li>
  <li>Vrij spelen / brainstorm</li>
</ul>


<script>
function checkPassword() {
    let input = prompt("Voer het wachtwoord in:");
    const correct = "cgjxp";

    if(input === null) return; // cancel knop
    if(input.toLowerCase() === correct) {
        alert("Wachtwoord correct! Je gaat door naar de volgende pagina.");
        window.location.href = "kamer1.4.html"; // pas aan naar jouw volgende pagina
    } else {
        alert("Fout wachtwoord. Probeer het opnieuw!");
    }
}

  function toggleAgenda() {
    const list = document.getElementById('agendaList');
    if (list.style.display === 'none' || list.style.display === '') {
      list.style.display = 'block';
    } else {
      list.style.display = 'none';
    }
  }
</script>

</body>
</html>
