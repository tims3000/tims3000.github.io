<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<!-- Google Font voor mysterious vibe -->
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/achtergrondlaptop.webp') no-repeat center center/cover;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* helemaal boven */
    align-items: flex-start;    /* helemaal links */
    padding: 20px;              /* beetje ruimte van de rand */
    color: #f5f5f5;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
}

.morse {
    display: flex;
    flex-direction: column;
    gap: 40px; /* grotere afstand tussen regels */
}

.morse-line {
    display: flex;
    gap: 15px; /* grotere afstand tussen plaatjes */
    flex-wrap: wrap; /* zorgt dat het netjes blijft bij grote iconen */
}

.dot {
    width: 80px;  /* realistische desktop icon grootte */
    height: 80px;
}

.space {
    background: transparent;
    width: 80px;  /* lege ruimte even groot als icon */
    height: 80px;
}
</style>
</head>
<body>

<div class="morse">

    <!-- Regel 1: C (-.-.) -->
    <div class="morse-line">
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
    </div>


       <!-- Regel 2: G (--.) -->
    <div class="morse-line">
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
    </div>

    <!-- Regel 3: J (.---) -->
    <div class="morse-line">
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
    </div>

    <!-- Regel 4: X (-..-) -->
    <div class="morse-line">
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
    </div>


    <!-- Regel 5: P (-..) -->
    <div class="morse-line">
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>

        <div class="space"></div>

        <div class="dot" style="background: url('img/icon/icon1.png') no-repeat center/contain;"></div>
    </div>

</div>

</body>
</html>
