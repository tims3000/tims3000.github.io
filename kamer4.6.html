<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/keuze.png') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.laptop {
    position: absolute;
    width: 150px;
    bottom: 25px;
    right: 350px;
    text-align: center;
    color: #fff;
    text-decoration: none;
}

.laptop span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
}

.laptop img {
    width: 100%;
}

.keuze {
    position: absolute;
    width: 200px;
    cursor: pointer;
}

.snelweg {
    left: 50px;
    top: 100px;
}

.tunnel {
    right: 50px;
    top: 100px;
}

</style>
</head>

<body>

<a href="kamer4.2.html" class="terug-knop">Terug</a>

<a href="kamer4.7.html" class="laptop">
    <img src="img/laptop.png" alt="folder">
    <span>Hacking Laptop</span>
</a>

<img src="img/snelweg.png" class="keuze snelweg" onclick="kiesSnelweg()">
<img src="img/tunnel.png" class="keuze tunnel" onclick="kiesTunnel()">

<script>

function kiesSnelweg(){
    if(localStorage.getItem("laptopBezocht") !== "true"){
        alert("Wees voorzichtig met snel kiezen! Anders kan de politie je makkelijk pakken.");
    } else {
        alert("Dit moet je niet doen! Ze gaan een helikopter inzetten, zo word je makkelijk gepakt.");
    }
}

function kiesTunnel(){
    if(localStorage.getItem("laptopBezocht") !== "true"){
        alert("Wees voorzichtig met snel kiezen! Anders kan de politie je makkelijk pakken.");
    } else {
        window.location.href = "kamer4.8.html"; // volgende pagina
    }
}

</script>

</body>
</html>
