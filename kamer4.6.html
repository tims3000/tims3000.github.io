<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/keuze.png') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.laptop {
    position: absolute;
    width: 150px;
    bottom: 25px;
    right: 350px;
    text-align: center;
    color: #fff;
    text-decoration: none;
}

.laptop span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
}

.laptop img {
    width: 100%;
}

.keuze {
    position: absolute;
    width: 200px;
    cursor: pointer;
}

.snelweg {
    left: 50px;
    top: 100px;
}

.tunnel {
    right: 50px;
    top: 100px;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 3px;
    border-radius: 6px;
    max-width: 1200px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    line-height: 1.1;
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<a href="kamer4.2.html" class="terug-knop">Terug</a>

<a href="kamer4.7.html" class="laptop">
    <img src="img/laptop.png" alt="folder">
    <span>Hacking Laptop</span>
</a>

<img src="img/snelweg.png" class="keuze snelweg" onclick="kiesSnelweg()">
<img src="img/tunnel.png" class="keuze tunnel" onclick="kiesTunnel()">

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
function kiesSnelweg(){
    if(localStorage.getItem("laptopBezocht") !== "true"){
        alert("Wees voorzichtig met snel kiezen! Anders kan de politie je makkelijk pakken.");
    } else {
        alert("Dit moet je niet doen! Ze gaan een helikopter inzetten, zo word je makkelijk gepakt.");
    }
}

function kiesTunnel(){
    if(localStorage.getItem("laptopBezocht") !== "true"){
        alert("Wees voorzichtig met snel kiezen! Anders kan de politie je makkelijk pakken.");
    } else {
        window.location.href = "kamer4.8.html";
    }
}

const uitlegTekst = "Je moet snel een keuze maken: links naar de snelweg of rechts naar geheime tunnels. De keuze hangt af van wat de politie doet, dus misschien kun je hun berichten onderscheppen."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30);
    }
}

typeUitleg();
</script>

</body>
</html>
