<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/achtergrondlaptop.png') no-repeat center center/cover;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 0;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    position: relative;
}

.icon-container {
    position: absolute;
    text-align: center;
    cursor: pointer;
}

#plattegrond-container {
    top: 10px;
    right: 10px;
}

#agenda-container {
    top: 125px;
    right: 50px;
}

#folder-container {
    top: 240px;
    right: 50px;
}

.icon-container img {
    width: 75px;
    height: auto;
}

.icon-container span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
    color: #fff;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.6);
    color: #f5f5f5;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 3px;
    border-radius: 6px;
    max-width: 1200px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    line-height: 1.1;
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<div id="plattegrond-container" class="icon-container" onclick="checkPassword()">
    <img src="img/plattegrond.png" alt="Plattegrond">
    <span>Bouw Plattegrond Juwelier</span>
</div>

<div id="agenda-container" class="icon-container" onclick="showAgenda()">
    <img src="img/agenda.png" alt="Agenda">
    <span>Agenda</span>
</div>

<a href="kamer1.5.html" id="folder-container" class="icon-container">
    <img src="img/folder.png" alt="folder">
    <span>Foto's Werk</span>
</a>

<a href="kamer1.2.html" class="terug-knop">Terug</a>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
function checkPassword() {
    let input = prompt("Voer het wachtwoord in:");
    const correct = "cgjxp";

    if(input === null) return;
    if(input.toLowerCase() === correct) {
        alert("Wachtwoord correct! Je gaat door naar de volgende pagina.");
        window.location.href = "kamer1.6.html";
    } else {
        alert("Fout wachtwoord. Probeer het opnieuw!");
    }
}

function showAgenda() {
    const agendaItems = [
        "09:00 - Team meeting",
        "10:30 - Documenten controleren",
        "12:00 - Lunchpauze",
        "13:00 - Klantafspraak",
        "14:30 - Morscode leren",
        "15:00 - E-mails beantwoorden",
        "16:00 - Projectplanning"
    ];

    alert("Agenda:\n\n" + agendaItems.join("\n"));
}

const uitlegTekst = "Hé, de plattegrond van de juwelier! Dat is pas handig. Helaas moet je eerst nog een wachtwoord invoeren voordat je hem kunt bekijken."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30);
    }
}

typeUitleg();
</script>

</body>
</html>
