<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/achtergrondlaptop.png') no-repeat center center/cover;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 0;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    position: relative;
}

/* Container voor icoon + tekst */
.icon-container {
    position: absolute;
    text-align: center;
    cursor: pointer;
}

#plattegrond-container {
    top: 10px;
    right: 10px;
}

#agenda-container {
    top: 125px; /* onder de plattegrond, pas afstand aan indien nodig */
    right: 50px;
}

.icon-container img {
    width: 75px;    /* pas grootte aan */
    height: auto;
}

.icon-container span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
    color: #fff;
}

        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
</style>
</head>
<body>

<!-- Plattegrond -->
<div id="plattegrond-container" class="icon-container" onclick="checkPassword()">
    <img src="img/plattegrond.png" alt="Plattegrond">
    <span>Bouw Plattegrond Juwelier</span>
</div>

<!-- Agenda -->
<div id="agenda-container" class="icon-container" onclick="showAgenda()">
    <img src="img/agenda.png" alt="Agenda">
    <span>Agenda</span>
</div>

    <a href="kamer1.2.html" class="terug-knop">Terug</a>

<script>
function checkPassword() {
    let input = prompt("Voer het wachtwoord in:");
    const correct = "cgjxp";

    if(input === null) return; // cancel knop
    if(input.toLowerCase() === correct) {
        alert("Wachtwoord correct! Je gaat door naar de volgende pagina.");
        window.location.href = "kamer1.6.html"; // pas aan naar jouw volgende pagina
    } else {
        alert("Fout wachtwoord. Probeer het opnieuw!");
    }
}

function showAgenda() {
    const agendaItems = [
        "09:00 - Team meeting",
        "10:30 - Documenten controleren",
        "12:00 - Lunchpauze",
        "13:00 - Klantafspraak",
        "14:30 - Morscode leren",  // jouw speciale item
        "15:00 - E-mails beantwoorden",
        "16:00 - Projectplanning"
    ];

    alert("Agenda:\n\n" + agendaItems.join("\n"));
}
</script>

</body>
</html>
