<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/juwelierlaptop.png') no-repeat center center/cover;
            position: relative;
            color: #f5f5f5;
        }

        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* ============================= */
        /* HIER KUN JE POSITIE & GROOTTE AANPASSEN */
        .schakelaar {
            position: absolute;

            top: 50%;       /* verticale positie */
            left: 50%;      /* horizontale positie */
            transform: translate(-50%, -50%); /* perfect midden */

            width: 150px;   /* breedte aanpassen */
            height: auto;   /* hoogte automatisch */
            cursor: pointer;
        }
        /* ============================= */

    </style>
</head>
<body>

    <a href="kamer2.7.html" class="terug-knop">Terug</a>

    <!-- Schakelaar -->
    <img src="img/on.png" id="schakelaar" class="schakelaar" alt="Schakelaar">

    <script>
        const schakelaar = document.getElementById("schakelaar");

        schakelaar.addEventListener("click", function() {
            
            // Zet naar OFF
            schakelaar.src = "img/off.png";

            alert("Je kunt dit systeem niet uitschakelen...");

            // Na 1.5 seconde weer terug naar ON
            setTimeout(function() {
                schakelaar.src = "img/on.png";
            }, 1500); // 1500ms = 1.5 seconde
        });
    </script>

</body>
</html>
