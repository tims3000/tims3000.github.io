<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/juwelierlaptop.png') no-repeat center center/cover;
            position: relative;
            color: #f5f5f5;
        }

        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .schakelaar {
            position: absolute;

            top: 50%;       /* verticale positie */
            left: 50%;      /* horizontale positie */
            transform: translate(-50%, -50%); /* perfect midden */

            width: 300px;   /* breedte aanpassen */
            height: auto;   /* hoogte automatisch */
            cursor: pointer;
        }


        .uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
    </style>
</head>
<body>

    <a href="kamer2.7.html" class="terug-knop">Terug</a>

    <!-- Schakelaar -->
    <img src="img/on.png" id="schakelaar" class="schakelaar" alt="Schakelaar">

    <div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
    const schakelaar = document.getElementById("schakelaar");

    schakelaar.addEventListener("click", function() {

        // Zet naar OFF
        schakelaar.src = "img/off.png";

        // Na 1.5 seconde weer terug naar ON
        setTimeout(function() {
            schakelaar.src = "img/on.png";

            // Alert NA het terugzetten
            alert("Je kunt dit systeem niet uitschakelen de firewall ziet dit apperaat als onbekent dus laat het niet de actie uitvoeren");

        }, 1000); // 1500ms = 1.5 seconde

    });

const uitlegTekst = "Misschien kun je via deze hack-laptop de elektriciteit uitschakelen. Hopelijk blokkeert de firewall de actie niet, omdat het een onbekend apparaat is."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();
</script>

</body>
</html>
