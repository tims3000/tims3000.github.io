<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/ferrari.jpg') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-align: center;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.next-button {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1000px;
    height: 400px;
    background-color: rgba(255,255,255,0.0);
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

</style>
</head>

<body>

<a href="kamer3.7.html" class="terug-knop">Terug</a>

<button class="next-button" onclick="location.href='kamer4.2.html'"></button>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

    <script>
const uitlegTekst = "Goed gedaan, de DDoS-aanval was succesvol. Omdat er zoveel requests op het politiesysteem binnenkwamen, werd het te veel en crashte het systeem, waardoor de politie niets meer kon doen. Maar stap snel in de auto, want het duurt niet lang voordat het politiesysteem weer werkt en ze achter je aan komen."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();
    </script>

</body>
</html>
