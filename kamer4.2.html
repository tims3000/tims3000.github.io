<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/auto.png') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-align: center;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.laptop {
    position: absolute;
    width: 150px;
    bottom: 25px;
    right: 350px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    color: #fff;
    text-decoration: none;
}

.laptop span {
    display: block;
    margin-top: 5px;
    font-size: 14px;
}

.laptop img {
    width: 100%;
    height: auto;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 3px;
    border-radius: 6px;
    max-width: 1200px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    line-height: 1.1;
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<a href="kamer4.1.html" class="terug-knop">Terug</a>

<a href="kamer4.3.html" class="laptop">
    <img src="img/laptop.png" alt="folder">
    <span>Hacking Laptop</span>
</a>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
const uitlegTekst = "Oh shit, de politie zit weer achter je aan. Hé, een spoorwegovergang. Misschien kun je de slagboom hacken zodat hij net achter jou dichtgaat en de politie niet meer door kan."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30);
    }
}

typeUitleg();
</script>

</body>
</html>
