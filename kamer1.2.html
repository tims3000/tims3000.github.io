<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-image: url('img/achtergrondbinnen.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        /* Stijl voor de vierkante knop */
        .next-button {
            position: fixed;
            bottom: 5px; /* pas hier aan om omhoog/omlaag te schuiven */
            right: 85px;  /* pas hier aan om links/rechts te schuiven */
            width: 60px;  /* breedte van de knop */
            height: 60px; /* hoogte van de knop, maakt het vierkant */
            background-color: rgba(255, 255, 255, 0.5); /* 50% doorzichtig */
            border: none;
            border-radius: 8px; /* kleine afgeronde hoeken, optioneel */
            cursor: pointer;
        }

</head>

    <button class="next-button" onclick="location.href='kamer1.3.html'"></button>
