<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room - Code</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-image: url('img/achtergrondbinnen.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        /* Vierkante knop rechtsonder */
        .next-button {
            position: fixed;
            bottom: 5px;
            right: 80px;
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.0);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Lange knop in het midden */
        .code-button {
            position: fixed;
            bottom: 195px;
            left: 50%;
            transform: translate(-50%, -50%); /* precies centreren */
            width: 280px; /* lengte knop */
            height: 40px; /* hoogte knop */
            background-color: rgba(255, 255, 255, 0.0); /* 50% doorzichtig */
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

                .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.7rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
    </style>
</head>
<body>

    <!-- Vierkante knop rechtsonder -->
    <button class="next-button" onclick="location.href='kamer1.3.html'"></button>

    <!-- Lange code knop midden -->
    <button class="code-button" onclick="checkCode()"></button>

        <a href="kamer1.1.html" class="terug-knop">Terug</a>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

        
    <script>
        function checkCode() {
            const juisteCode = "kbuwd"; // stel hier de juiste code in
            let invoer = prompt("Voer de code in:");
            
            if (invoer === null) return; // gebruiker annuleert
            if (invoer === juisteCode) {
                // juiste code → volgende pagina
                 alert("Wachtwoord correct! Je gaat door naar de volgende pagina.");
                location.href = "kamer1.4.html";
            } else {
                // foutmelding
                alert("Foute code, probeer het opnieuw!");
            }
        }

const uitlegTekst = "Lekker, je bent binnen! Hé, daar ligt een laptop. Er staat vast iets belangrijks op, maar wat zou het wachtwoord kunnen zijn?"; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();
    </script>

</body>
</html>
