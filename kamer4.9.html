<body>

<div class="quiz-box">
<h2>Wat heb je nodig om veilig op het darkweb te browsen?</h2>

<label><input type="checkbox" id="tor"> Tor Browser</label><br>
<label><input type="checkbox" id="vpn"> Betrouwbare VPN</label><br>
<label><input type="checkbox"> Google Chrome</label><br>
<label><input type="checkbox"> Je normale internetprovider</label><br>
<label><input type="checkbox"> Alleen incognito modus</label><br>

<button onclick="checkAntwoord()">Controleer antwoord</button>
</div>

<script>
function checkAntwoord(){

let tor = document.getElementById("tor").checked;
let vpn = document.getElementById("vpn").checked;

if(tor && vpn){

else{
    alert("Niet helemaal goed... Probeer opnieuw.");
}
