<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/autolaptop1.png') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-align: center;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.quiz-box {
    background: rgba(0,0,0,0.65);
    padding: 40px;
    border-radius: 10px;
    text-align: left;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    background: #444;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #666;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 3px;
    border-radius: 6px;
    max-width: 1200px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    line-height: 1.1;
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<a href="kamer4.8.html" class="terug-knop">Terug</a>

<div class="quiz-box">
    <h2>Wat heb je nodig om veilig op het darkweb te browsen?</h2>

    <label><input type="checkbox" id="tor"> Tor Browser</label><br>
    <label><input type="checkbox"> Google Chrome</label><br>
    <label><input type="checkbox"> Je normale internetprovider</label><br>
    <label><input type="checkbox" id="vpn"> Betrouwbare VPN</label><br>
    <label><input type="checkbox"> Alleen incognito modus</label><br>

    <button onclick="checkAntwoord()">Controleer antwoord</button>
</div>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
function checkAntwoord() {
    let tor = document.getElementById("tor").checked;
    let vpn = document.getElementById("vpn").checked;

    const alleCheckboxes = document.querySelectorAll(".quiz-box input[type='checkbox']");
    let foutAangevinkt = false;
    alleCheckboxes.forEach(cb => {
        if(cb.checked && cb.id !== "tor" && cb.id !== "vpn") {
            foutAangevinkt = true;
        }
    });

    if(tor && vpn && !foutAangevinkt) {
        window.location.href = "kamer4.10.html";
    } else {
        alert("Niet helemaal goed... Probeer opnieuw. Alleen Tor Browser en een betrouwbare VPN moeten aangevinkt zijn.");
    }
}

const uitlegTekst = "Oké, een paar dingen zijn erg belangrijk als je het dark web opgaat, dus zorg dat alles in orde is voordat je naar een plattegrond gaat zoeken."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30);
    }
}

typeUitleg();
</script>

</body>
</html>
