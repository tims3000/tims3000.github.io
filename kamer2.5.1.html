<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: url('img/bureau.avif') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

        .top-image {
            margin-top: 40px;
            text-align: center;
        }

        .top-image img {
            width: 550px;
            height: auto;
        }

                        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

                .verder-knop {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .verder-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="top-image">
        <img src="img/id1.5.png" alt="Hoofd afbeelding">
    </div>

    <a href="kamer2.6.html" class="verder-knop">Verder</a>

     <a href="kamer2.4.1.html" class="terug-knop">Terug</a>

</body>

<script>
document.addEventListener("DOMContentLoaded", function() {
    
    // Reset eerst het oude nummer
    localStorage.removeItem("toegangCode");

    // Maak een nieuw willekeurig nummer (bijvoorbeeld 6 cijfers)
    let nieuwNummer = 1;

    // Sla het nummer op in localStorage
    localStorage.setItem("toegangCode", nieuwNummer);

    console.log("Nieuw nummer opgeslagen:", nieuwNummer);
});
</script>

</html>
