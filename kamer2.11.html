<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/gtaachtergrond.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

                /* Lange knop in het midden */
        .code-button {
            position: fixed;
            bottom: 195px;
            left: 50%;
            transform: translate(-50%, -50%); /* precies centreren */
            width: 280px; /* lengte knop */
            height: 40px; /* hoogte knop */
            background-color: rgba(255, 255, 255, 0.5); /* 50% doorzichtig */
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

    </style>
</head>
<body>
    <!-- Lange code knop midden -->
    <button class="code-button" onclick="checkCode()"></button>

    <a href="kamer2.9.html" class="terug-knop">Terug</a>

</body>

    <script>
        function checkCode() {
            const juisteCode = "2nf9w"; // stel hier de juiste code in
            let invoer = prompt("Voer de code in:");
            
            if (invoer === null) return; // gebruiker annuleert
            if (invoer === juisteCode) {
                // juiste code → volgende pagina
                 alert("Wachtwoord correct! Je gaat door naar de volgende pagina.");
                location.href = "kamer2.12.html";
            } else {
                // foutmelding
                alert("Foute code, probeer het opnieuw!");
            }
        }
    </script>

</html>
