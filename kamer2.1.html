<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: url('img/bureau.avif') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
}

.top-image {
    margin-top: 40px;
    text-align: center;
}

.top-image img {
    width: 550px;
    height: auto;
}

.image-grid {
    margin-top: 40px;
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.image-grid img {
    width: 35mm;
    height: 45mm;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}

.image-grid img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
}

                .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

</style>

</head>

<body>


    <!-- Bovenste afbeelding -->
    <div class="top-image">
        <img src="img/id.jpg" alt="Hoofd afbeelding">
    </div>

    <!-- Vier klikbare afbeeldingen -->
    <div class="image-grid">
        <a href="kamer2.1.1.html">
            <img src="img/id1.png" alt="Id 1">
        </a>
        <a href="kamer2.1.2.html">
            <img src="img/id2.png" alt="Id 2">
        </a>
        <a href="kamer2.1.3.html">
            <img src="img/id3.png" alt="Id 3">
        </a>
        <a href="kamer2.1.4.html">
            <img src="img/id4.png" alt="Id 4">
        </a>
    </div>

     <a href="kamer1.5.html" class="terug-knop">Terug</a>

</body>

</html>
