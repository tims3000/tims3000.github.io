<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: url('img/bureau.avif') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
}

.top-image {
    margin-top: 40px;
    text-align: center;
}

.top-image img {
    width: 550px;
    height: auto;
}

.image-grid {
    margin-top: 40px;
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.image-grid img {
    width: 35mm;
    height: 45mm;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}

.image-grid img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
}

                .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

                                .uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

</style>

</head>

<body>


    <!-- Bovenste afbeelding -->
    <div class="top-image">
        <img src="img/id.jpg" alt="Hoofd afbeelding">
    </div>

    <!-- Vier klikbare afbeeldingen -->
    <div class="image-grid">
        <a href="kamer2.1.1.html">
            <img src="img/id1.png" alt="Id 1">
        </a>
        <a href="kamer2.1.2.html">
            <img src="img/id2.png" alt="Id 2">
        </a>
        <a href="kamer2.1.3.html">
            <img src="img/id3.png" alt="Id 3">
        </a>
        <a href="kamer2.1.4.html">
            <img src="img/id4.png" alt="Id 4">
        </a>
    </div>

     <a href="kamer1.6.html" class="terug-knop">Terug</a>

              <div class="uitleg-box">
    <p id="type-text"></p>
</div>

            <script>
const uitlegTekst = "Oké, je gaat dus proberen binnen te komen met identiteitsfraude. Hiervoor moet je nu het pasje samenstellen om binnen te komen. Zorg er wel voor dat het een realistisch pasje is."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();
    </script>

</body>

</html>
