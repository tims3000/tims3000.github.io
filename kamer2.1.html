<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/bureau.avif') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

        .container {
    display: flex;
    gap: 100px;
    margin-bottom: 50px;
}

.id-card {
    width: 250px;
    height: 350px;
    background: rgba(0,0,0,0.7);
    border: 3px solid #f5f5f5;
    padding: 20px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
}

.photo-slot {
    width: 100%;
    height: 250px;
    background: rgba(255,255,255,0.1);
    border: 2px dashed #aaa;
    margin-top: 15px;
}

.photos {
    display: flex;
    gap: 50px;
}

.photos img {
    width: 150px;
    cursor: grab;
}

    </style>
</head>
<body>

<div class="container">
    <!-- ID kaarten -->
    <div class="id-card" data-name="JohannesBakker">
        <h2>Johannes Bakker</h2>
        <div class="photo-slot" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>

    <div class="id-card" data-name="ElindeGraaf">
        <h2>Elinde Graaf</h2>
        <div class="photo-slot" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>
</div>

<!-- Sleepbare foto's -->
<div class="photos">
    <img src="ElindeGraaf.webp" id="ElindeGraaf" draggable="true" ondragstart="drag(event)">
    <img src="JohannesBakker.avif" id="JohannesBakker" draggable="true" ondragstart="drag(event)">
</div>

<script>
function allowDrop(ev) {
    ev.preventDefault();
}

function drag(ev) {
    ev.dataTransfer.setData("text", ev.target.id);
}

function drop(ev) {
    ev.preventDefault();
    var data = ev.dataTransfer.getData("text");
    var draggedElement = document.getElementById(data);

    var card = ev.target.closest(".id-card");
    var correctName = card.getAttribute("data-name");

    if (data === correctName) {
        ev.target.innerHTML = "";
        ev.target.appendChild(draggedElement);
        draggedElement.style.width = "100%";
        draggedElement.style.height = "100%";
        draggedElement.style.objectFit = "cover";
    } else {
        alert("❌ Verkeerd! Probeer opnieuw.");
    }
}
</script>

</body>
</html>
