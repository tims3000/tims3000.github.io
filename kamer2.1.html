<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: url('img/bureau.avif') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
}

.top-image {
    margin-top: 40px;
    text-align: center;
}

.top-image img {
    width: 300px;   /* Pas grootte aan indien nodig */
    height: auto;
}

.image-grid {
    margin-top: 40px;
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

.image-grid img {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer;
}

.image-grid img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
}

</style>

</head>

<body>


    <!-- Bovenste afbeelding -->
    <div class="top-image">
        <img src="img/id.jpg" alt="Hoofd afbeelding">
    </div>

    <!-- Vier klikbare afbeeldingen -->
    <div class="image-grid">
        <a href="pagina1.html">
            <img src="img/idee1.jpg" alt="Idee 1">
        </a>
        <a href="pagina2.html">
            <img src="img/idee2.jpg" alt="Idee 2">
        </a>
        <a href="pagina3.html">
            <img src="img/idee3.jpg" alt="Idee 3">
        </a>
        <a href="pagina4.html">
            <img src="img/idee4.jpg" alt="Idee 4">
        </a>
    </div>


</body>

</html>
