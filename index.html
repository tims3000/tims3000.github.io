<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #f5f5f5;
            text-align: center;
            background: url('img/startachtergrond.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 5em;
            margin: 0.2em 0;
            letter-spacing: 4px;
        }

        p {
            font-size: 2em;
            margin: 0.5em 0 2em;
        }

        .start-button {
            padding: 1em 2.5em;
            font-size: 1.5em;
            background-color: #b30000;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(179,0,0,0.7);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255,0,0,1);
        }

        .credits {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .uitleg-box {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            line-height: 1.2;
            max-width: 90%;
            color: #f5f5f5;
            word-wrap: break-word;
        }

        #type-text::after {
            content: "|";
            margin-left: 2px;
            animation: knipper 1s infinite;
        }

        @keyframes knipper {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>Escape Room</h1>
    <p>breek in de juwelier</p>

    <a href="kamer1.1.html">
        <button class="start-button" onclick="startTimer()">Start</button>
    </a>

    <div class="credits">
        Gemaakt door: <br>
        Francesco Mandas • Mike Boom • Thijs Kanbier • Tim Schiltmans
    </div>

    <div class="uitleg-box">
        <p id="type-text"></p>
    </div>

    <script>
        function startTimer() {
            localStorage.setItem('startTime', Date.now());
            localStorage.removeItem('juwelenSlots');
        }

        const uitlegTekst = "Welkom bij onze escaperoom! Het doel is om zo snel mogelijk de juwelen uit de juwelier te stelen en hiermee zoveel mogelijk geld te verdienen."; 
        const uitlegElement = document.getElementById("type-text");
        let uitlegIndex = 0;

        function typeUitleg() {
            if (uitlegIndex < uitlegTekst.length) {
                uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
                uitlegIndex++;
                setTimeout(typeUitleg, 30);
            }
        }

        typeUitleg();
    </script>
</body>
</html>
