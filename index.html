<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>
    <style>
        /* Zorg dat body en html de volledige hoogte gebruiken */
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

body {
    /* Achtergrond volledig scherm */
    background-image: url('achtergrond.jpg');
    background-size: cover;      /* vult altijd het scherm */
    background-position: center; /* centreert de afbeelding */
    background-repeat: no-repeat; /* geen herhaling */
    
    /* Flex voor centreren van content */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    
    height: 100vh; /* volledige viewport hoogte */
    margin: 0;
    font-family: 'Arial', sans-serif;
    color: white;
    text-align: center;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}


        /* Titel styling */
        h1 {
            font-size: 5em;
            margin: 0.2em 0;
        }

        /* Subtitel styling */
        p {
            font-size: 2em;
            margin: 0.5em 0 2em 0;
        }

        /* Startknop styling */
        .start-button {
            padding: 1em 2em;
            font-size: 1.5em;
            background-color: #ffcc00;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .start-button:hover {
            transform: scale(1.1);
            background-color: #ffaa00;
        }
    </style>
</head>
<body>
    <h1>Escape Room</h1>
    <p>Breek in de juwelier</p>
    <a href="escape.html"><button class="start-button">Start</button></a>
</body>
</html>
