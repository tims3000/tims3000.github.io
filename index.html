<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/startachtergrond.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 5em;
            margin: 0.2em 0;
            letter-spacing: 4px;
        }

        p {
            font-size: 2em;
            margin: 0.5em 0 2em 0;
            opacity: 0.9;
        }

        .start-button {
            padding: 1em 2.5em;
            font-size: 1.5em;
            background-color: #b30000;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(179, 0, 0, 0.7);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 0, 0, 1);
        }

        .credits {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            opacity: 0.9;
            letter-spacing: 1px;
        }

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.5rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}




    </style>
</head>
<body>
    <h1>Escape Room</h1>
    <p>breek in de juwelier</p>

<a href="kamer1.1.html">
    <button class="start-button" onclick="startTimer()">Start</button>
</a>

    <div class="credits">
        Gemaakt door: <br>
        Francesco Mandas • Mike Boom • Thijs Kanbier • Tim Schiltmans
    </div>
</body>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
function startTimer() {
    // Starttijd opslaan in milliseconds
    localStorage.setItem('startTime', Date.now());
    
    // Ook eventuele oude data resetten
    localStorage.removeItem('juwelenSlots');
}

const uitlegTekst = "Welkom! bij onze escaperoom! Het doel is om zo snel mogelijk de juwelen uit de juwelier te stelen en hiermee zoveel mogelijk geld te verdienen."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();
</script>

</html>
