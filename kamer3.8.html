<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
}

body {
    background: url('img/buitenlaptop.png') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
    font-family: 'Montserrat', sans-serif;
    text-align: center;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0,0,0,0.8);
}

.vraag-box {
    background: rgba(0,0,0,0.75);
    padding: 40px;
    border-radius: 10px;
    max-width: 500px;
}

.vraag {
    font-size: 22px;
    margin-bottom: 25px;
}

.optie {
    display: block;
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
}

.optie:hover {
    background: #444;
}

#melding {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6); /* subtiel donker */
    padding: 3px;           /* nog kleiner in hoogte, breder horizontaal */
    border-radius: 6px;          /* kleine afgeronde hoeken */
    max-width: 1200px;            /* breder blok */
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;          /* klein lettertype */
    line-height: 1.1;            /* compacte regels */
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;        /* tekst gaat netjes over meerdere regels */
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

</style>
</head>

<body>

<a href="kamer3.7.html" class="terug-knop">Terug</a>

<div class="vraag-box">

<div class="vraag">
Wat kan ervoor zorgen dat een systeem crasht doordat het wordt overspoeld met verkeer?
</div>

<button class="optie" onclick="checkAntwoord('fout')">Een computervirus</button>
<button class="optie" onclick="checkAntwoord('goed')">Een DDoS-aanval</button>
<button class="optie" onclick="checkAntwoord('fout')">Phishing</button>

<div id="melding"></div>

    <div class="uitleg-box">
    <p id="type-text"></p>
</div>


</div>

<script>

function checkAntwoord(antwoord){

    let melding = document.getElementById("melding");

    if(antwoord === "goed"){
        melding.style.color = "lightgreen";
        melding.textContent = "Correct! Een DDoS-aanval overspoelt een systeem met verkeer waardoor het kan crashen.";

        // Na 2 seconden naar volgende pagina
        setTimeout(function(){
            window.location.href = "kamer4.1.html";
        }, 2000);
    } 
    else{
        melding.style.color = "red";
        melding.textContent = "Fout antwoord! Probeer het opnieuw.";
    }

}

const uitlegTekst = "Snel, kies het juiste antwoord zodat het systeem van de politie platgaat."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;

    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30); // snelheid typen
    }
}

typeUitleg();

</script>

</body>
</html>
