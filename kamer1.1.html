<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"> <!-- Zorgt voor correcte weergave van speciale tekens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Schalen op mobiel -->
    <title>Escape Room</title>

    <!-- Google Fonts voor sfeer -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        /* Body styling: achtergrond, centreren content, tekstkleur en schaduw voor leesbaarheid */
        body {
            background: url('img/garagedicht.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        /* Slot icoon styling */
        .lock-icon {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px; /* grootte slot icoon */
            opacity: 0.9;
        }

        /* Centrale box styling */
        .center-box {
            width: 80px;
            position: absolute;
            top: 50%;
            left: 95%;
            transform: translate(-50%, -50%);
            opacity: 0.95;
        }

        /* Stapel letters boven de box */
        .letter-stack {
            position: absolute;
            top: 62%;
            left: 2.5%;
            transform: translate(-50%, -130%); /* Positioneer boven box */
            display: flex;
            flex-direction: column;
            gap: 2px; /* Afstand tussen letters */
        }

        .letter-stack img {
            width: 25px;
            opacity: 0.95;
        }

        /* Poster die letters bedekt en klikbaar is */
        #poster {
            position: absolute;
            top: 50%;
            left: 3.5%;
            transform: translate(-50%, -50%);
            width: 120px;
            cursor: pointer; /* geeft aan dat erop geklikt kan worden */
            z-index: 10; /* boven de letters */
        }

        /* Terug-knop styling */
        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* Uitleg-box styling */
        .uitleg-box {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 3px;
            border-radius: 6px;
            max-width: 1200px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            line-height: 1.1;
            color: #f5f5f5;
            z-index: 1000;
            word-wrap: break-word;
        }

        /* Knipperende cursor voor type-effect */
        #type-text::after {
            content: "|";
            margin-left: 2px;
            animation: knipper 1s infinite;
        }

        @keyframes knipper {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Poster over de letters -->
    <img src="img/poster.jpeg" alt="Poster" id="poster">

    <!-- Stapel letters die samen code vormen -->
    <div class="letter-stack">
        <img src="img/E.png" alt="E">
        <img src="img/R.png" alt="R">
        <img src="img/Y.png" alt="Y">
        <img src="img/L.png" alt="L">
        <img src="img/K.png" alt="K">
    </div>

    <!-- Box en lock die interactief zijn -->
    <img src="img/box.webp" alt="Box" class="center-box" id="box">
    <img src="img/lock.png" alt="Lock" class="lock-icon" id="lock">

    <!-- Terug-knop naar startpagina -->
    <a href="index.html" class="terug-knop">Terug</a>

    <!-- Uitleg-box bovenaan -->
    <div class="uitleg-box">
        <p id="type-text"></p>
    </div>

<script>
    // Functie die checkt of speler de sleutel al heeft (localStorage gebruiken)
    const Key1 = () => localStorage.getItem("Key1") === "true";

    // Poster click event: verdwijnt bij klikken
    const poster = document.getElementById("poster");
    poster.addEventListener("click", () => {
        poster.style.display = "none"; // Poster weg
    });

    // Box click event
    document.getElementById("box").addEventListener("click", () => {
        if (Key1()) { // Check of sleutel al is gevonden
            alert("De box is al leeg. Je hebt de sleutel al 🔑");
            return;
        }

        const code = prompt("Voer de code in om de box te openen en de sleutel te krijgen:");
        if (!code) return;

        if (code.toLowerCase() === "erylk") { // Code check
            localStorage.setItem("Key1", "true"); // Sla sleutel op
            alert("✔️ Juist! Je hebt een sleutel gevonden 🔑");
        } else {
            alert("❌ Verkeerde code. De box blijft dicht.");
        }
    });

    // Lock click event: check sleutel voor volgende kamer
    document.getElementById("lock").addEventListener("click", () => {
        if (!Key1()) {
            alert("🔒 De deur zit op slot. Je hebt een sleutel nodig.");
        } else {
            window.location.href = "kamer1.2.html"; // Naar volgende pagina
        }
    });

    // Type-effect voor uitleg-box (zelfde principe als eerste pagina)
    const uitlegTekst = "Je hebt de garage van een medewerker weten te vinden. Je vermoedt dat er spullen in liggen die kunnen helpen bij het overvallen van de juwelier. Nu nog zien hoe je hem open krijgt."; 
    const uitlegElement = document.getElementById("type-text");
    let uitlegIndex = 0;

    function typeUitleg() {
        if (!uitlegElement) return;

        if (uitlegIndex < uitlegTekst.length) {
            uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
            uitlegIndex++;
            setTimeout(typeUitleg, 30); // Snelheid typen
        }
    }

    typeUitleg();
</script>

</body>
</html>
