<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: url('img/bureau.avif') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

        .top-image {
            margin-top: 40px;
            text-align: center;
        }

        .top-image img {
            width: 550px;
            height: auto;
        }

        .names-grid {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .names-grid button {
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .names-grid button:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.2);
        }

                        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="top-image">
        <img src="img/id2.2.png" alt="Hoofd afbeelding">
    </div>

    <!-- Namen onder ID -->
    <div class="names-grid">
        <button onclick="alert('Fout! Probeer opnieuw.')">10-11-1982</button>
        <button onclick="alert('Fout! Probeer opnieuw.')">03-09-2002</button>
        <button onclick="alert('Fout! Probeer opnieuw.')">21-05-1973</button>
        <button onclick="goNext()">29-01-2006</button>
    </div>

 <a href="kamer2.1.2.html" class="terug-knop">Terug</a>

    <script>
        function goNext() {
            // Naar de volgende pagina
            window.location.href = "kamer2.3.2.html";
        }
    </script>

</body>
</html>
