<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room - Fake ID Maker</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>

html, body {
    height: 100%;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: url('img/bureau.avif') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #f5f5f5;
}

/* =========================
   ID KAART WEERGAVE
   ========================= */

.id-card {
    position: relative;
    margin-top: 40px;
}

.id-card img {
    width: 550px;
}

/* =========================
   AANPASBARE POSITIES
   Hier kun je alles verplaatsen
   ========================= */

.id-foto {
    position: absolute;
    top: 150px;  
    left: 60px; 
    width: 35mm;
    height: 45mm;
    object-fit: cover;
}

.id-naam {
    position: absolute;
    top: 160px;   /* <-- NAAM positie */
    left: 220px;
    font-weight: 500;
}

.id-geboorte {
    position: absolute;
    top: 200px;   /* <-- GEBOORTEDATUM positie */
    left: 220px;
}

.id-nationaliteit {
    position: absolute;
    top: 240px;   /* <-- NATIONALITEIT positie */
    left: 220px;
}

.id-lengte {
    position: absolute;
    top: 280px;   /* <-- LENGTE positie */
    left: 220px;
}

/* =========================
   KEUZE BLOKKEN
   ========================= */

.keuze-container {
    margin-top: 40px;
    display: none;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.keuze-container img,
.keuze-container div {
    width: 35mm;
    height: 45mm;
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.3s;
    text-align: center;
    padding: 5px;
}

.keuze-container img:hover,
.keuze-container div:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
}

.terug-knop:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

</style>
</head>

<body>

<a href="kamer1.5.html" class="terug-knop">Terug</a>

<!-- ID KAART -->
<div class="id-card">
    <img src="img/id.jpg" alt="ID achtergrond">

    <img id="gekozenFoto" class="id-foto" src="">
    <div id="gekozenNaam" class="id-naam"></div>
    <div id="gekozenGeboorte" class="id-geboorte"></div>
    <div id="gekozenNationaliteit" class="id-nationaliteit"></div>
    <div id="gekozenLengte" class="id-lengte"></div>
</div>

<!-- FOTO KEUZE -->
<div id="fotoKeuze" class="keuze-container" style="display:flex;">
    <img src="img/id1.png" onclick="kiesFoto(this.src)">
    <img src="img/id2.png" onclick="kiesFoto(this.src)">
    <img src="img/id3.png" onclick="kiesFoto(this.src)">
    <img src="img/id4.png" onclick="kiesFoto(this.src)">
</div>

<!-- NAAM KEUZE -->
<div id="naamKeuze" class="keuze-container">
    <div onclick="kiesNaam('Carlos Ramírez')">Carlos Ramírez</div>
    <div onclick="kiesNaam('Hendrik van Dijk')">Hendrik van Dijk</div>
    <div onclick="kiesNaam('Mei Lin')">Mei Lin</div>
    <div onclick="kiesNaam('Fatima Al-Zahra')">Fatima Al-Zahra</div>
</div>

<!-- GEBOORTE KEUZE -->
<div id="geboorteKeuze" class="keuze-container">
    <div onclick="kiesGeboorte('03-09-2002')">03-09-2002</div>
    <div onclick="kiesGeboorte('21-05-1973')">21-05-1973</div>
    <div onclick="kiesGeboorte('10-11-1982')">10-11-1982</div>
    <div onclick="kiesGeboorte('29-01-2006')">29-01-2006</div>
</div>

<!-- NATIONALITEIT KEUZE -->
<div id="nationaliteitKeuze" class="keuze-container">
    <div onclick="kiesNationaliteit('China')">China</div>
    <div onclick="kiesNationaliteit('Nederland')">Nederland</div>
    <div onclick="kiesNationaliteit('Afghanistan')">Afghanistan</div>
    <div onclick="kiesNationaliteit('Mexico')">Mexico</div>
</div>

<!-- LENGTE KEUZE -->
<div id="lengteKeuze" class="keuze-container">
    <div onclick="kiesLengte('1,54 m')">1,54 m</div>
    <div onclick="kiesLengte('1,60 m')">1,60 m</div>
    <div onclick="kiesLengte('1,78 m')">1,78 m</div>
    <div onclick="kiesLengte('1,97 m')">1,97 m</div>
</div>

<script>

function kiesFoto(src) {
    document.getElementById("gekozenFoto").src = src;
    document.getElementById("fotoKeuze").style.display = "none";
    document.getElementById("naamKeuze").style.display = "flex";
}

function kiesNaam(naam) {
    document.getElementById("gekozenNaam").innerText = naam;
    document.getElementById("naamKeuze").style.display = "none";
    document.getElementById("geboorteKeuze").style.display = "flex";
}

function kiesGeboorte(datum) {
    document.getElementById("gekozenGeboorte").innerText = datum;
    document.getElementById("geboorteKeuze").style.display = "none";
    document.getElementById("nationaliteitKeuze").style.display = "flex";
}

function kiesNationaliteit(nat) {
    document.getElementById("gekozenNationaliteit").innerText = nat;
    document.getElementById("nationaliteitKeuze").style.display = "none";
    document.getElementById("lengteKeuze").style.display = "flex";
}

function kiesLengte(lengte) {
    document.getElementById("gekozenLengte").innerText = lengte;
    document.getElementById("lengteKeuze").style.display = "none";
}

</script>

</body>
</html>
