<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Room</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: url('img/bureau.avif') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #f5f5f5;
}

.top-image {
    margin-top: 40px;
    text-align: center;
}

.top-image img {
    width: 550px;
    height: auto;
}

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.6);
    color: #f5f5f5;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    border-radius: 5px;
    transition: background 0.3s;
}

.terug-knop:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

.verder-knop {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    background-color: rgba(0, 0, 0, 0.6);
    color: #f5f5f5;
    text-decoration: none;
    font-family: 'Montserrat', sans-serif;
    border-radius: 5px;
    transition: background 0.3s;
}

.verder-knop:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

.uitleg-box {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 3px;
    border-radius: 6px;
    max-width: 1200px;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    line-height: 1.1;
    color: #f5f5f5;
    z-index: 1000;
    word-wrap: break-word;
}

#type-text::after {
    content: "|";
    margin-left: 2px;
    animation: knipper 1s infinite;
}

@keyframes knipper {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<div class="top-image">
    <img src="img/id4.5.png" alt="Hoofd afbeelding">
</div>

<a href="kamer2.6.html" class="verder-knop">Verder</a>

<a href="kamer2.4.4.html" class="terug-knop">Terug</a>

<div class="uitleg-box">
    <p id="type-text"></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    localStorage.removeItem("toegangCode");
    let idcode = 4;
    localStorage.setItem("toegangCode", idcode);
    console.log("Nieuw nummer opgeslagen:", idcode);
});

const uitlegTekst = "Dit ziet eruit als een realistische ID. Nu hopen dat hij ook werkt."; 
const uitlegElement = document.getElementById("type-text");
let uitlegIndex = 0;

function typeUitleg() {
    if (!uitlegElement) return;
    if (uitlegIndex < uitlegTekst.length) {
        uitlegElement.innerHTML += uitlegTekst.charAt(uitlegIndex);
        uitlegIndex++;
        setTimeout(typeUitleg, 30);
    }
}

typeUitleg();
</script>

</body>
</html>
