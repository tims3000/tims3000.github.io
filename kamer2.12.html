<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/desktopachtergrond.png') no-repeat center center/cover;
            position: relative;
            color: #f5f5f5;
        }

        .terug-knop {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #f5f5f5;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* ============================= */
        /* HIER KUN JE POSITIE & GROOTTE AANPASSEN */
        .schakelaar {
            position: absolute;

            top: 50%;       /* verticale positie */
            left: 50%;      /* horizontale positie */
            transform: translate(-50%, -50%); /* perfect midden */

            width: 300px;   /* breedte aanpassen */
            height: auto;   /* hoogte automatisch */
            cursor: pointer;
        }
        /* ============================= */

    </style>
</head>
<body>

    <a href="kamer2.11.html" class="terug-knop">Terug</a>

    <!-- Schakelaar -->
    <img src="img/on.png" id="schakelaar" class="schakelaar" alt="Schakelaar">

<script>
    const schakelaar = document.getElementById("schakelaar");

    // 🔹 Controleer bij laden van pagina wat de status is
    const status = localStorage.getItem("schakelaarStatus");

    if (status === "off") {
        schakelaar.src = "img/off.png";
    } else {
        schakelaar.src = "img/on.png";
    }

    // 🔹 Klik event
    schakelaar.addEventListener("click", function() {

        // Zet naar OFF
        schakelaar.src = "img/off.png";

        // Sla op in localStorage
        localStorage.setItem("schakelaarStatus", "off");

        // Alert
        alert("Bekend apparaat dus de firewall laat de actie toe...");
    });
</script>

</body>
</html>
