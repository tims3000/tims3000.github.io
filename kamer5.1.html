<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/einde.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        #totaal {
    text-align: center;
    font-family: 'Creepster', cursive;
    font-size: 2rem;
    margin-top: 50px;
}

#totaal::after{
    content: "|";
    animation: knipper 1s infinite;
}

@keyframes knipper{
    0%{opacity:1;}
    50%{opacity:0;}
    100%{opacity:1;}
}
    </style>
</head>
<body>

<a href="index.html" class="terug-knop" onclick="resetGame()">Opnieuw spelen</a>

<div id="totaal"></div>

</body>

<script>

function resetGame(){
    localStorage.removeItem('juwelenSlots');
    localStorage.removeItem('startTime');
    localStorage.removeItem('endTime');
}

// Waarden per juweel
const juweelWaarden = {
    1: 85000,
    2: 32000,
    3: 56000,
    4: 47000,
    5: 120000,
    6: 250000,
    7: 21000,
    8: 39000,
    9: 68000,
    10: 74000
};

// Gekozen juwelen ophalen
const gekozen = JSON.parse(localStorage.getItem("juwelenSlots")) || [];

// Totaal berekenen
let totaal = 0;
gekozen.forEach(juweelId => {
    if(juweelId !== null){
        totaal += juweelWaarden[juweelId];
    }
});

// Tijd berekenen
const startTime = localStorage.getItem('startTime');
let endTime = localStorage.getItem('endTime');

// als eindtijd nog niet bestaat -> nu opslaan
if(!endTime){
    endTime = Date.now();
    localStorage.setItem('endTime', endTime);
}

let tijdTekst = '';

if(startTime){
    const diff = endTime - startTime;

    const seconden = Math.floor(diff / 1000) % 60;
    const minuten = Math.floor(diff / (1000 * 60)) % 60;
    const uren = Math.floor(diff / (1000 * 60 * 60));

    tijdTekst = `<p>Je deed er ${uren} uur, ${minuten} min, ${seconden} sec over!</p>`;
}

const container = document.getElementById("totaal");

const zinnen = [
    "Gefeliciteerd!",
    `Je hebt een totaal van €${totaal} buitgemaakt!`,
    tijdTekst.replace(/<[^>]*>/g, "") // haalt <p> weg zodat alleen tekst overblijft
];

let zinIndex = 0;
let charIndex = 0;

function typeWriter() {

    if(zinIndex >= zinnen.length) return;

    const huidigeZin = zinnen[zinIndex];

    if(charIndex === 0){
        const p = document.createElement("p");
        p.id = "zin-" + zinIndex;
        container.appendChild(p);
    }

    const element = document.getElementById("zin-" + zinIndex);

    if(charIndex < huidigeZin.length){

        element.innerHTML += huidigeZin.charAt(charIndex);
        charIndex++;

        setTimeout(typeWriter, 50); // snelheid typen

    } else {

        zinIndex++;
        charIndex = 0;

        setTimeout(typeWriter, 600); // pauze tussen zinnen
    }
}

typeWriter();

</script>

</html>
