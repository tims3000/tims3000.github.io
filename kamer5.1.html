<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/einde.png') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
        }

.terug-knop {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: rgba(0,0,0,0.6);
    color: #f5f5f5;
    text-decoration: none;
    border-radius: 5px;
    transition: background 0.3s;
}

        .terug-knop:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        #totaal {
    text-align: center;
    font-family: 'Creepster', cursive;
    font-size: 2rem;
    margin-top: 50px;
}
    </style>
</head>
<body>

<a href="index.html" class="terug-knop" onclick="resetGame()">Opnieuw spelen</a>

<div id="totaal"></div>

</body>

<script>

function resetGame(){
    localStorage.removeItem('juwelenSlots');
    localStorage.removeItem('startTime');
}

    // Waarden per juweel
    const juweelWaarden = {
        1: 85000,
        2: 32000,
        3: 56000,
        4: 47000,
        5: 120000,
        6: 250000,
        7: 21000,
        8: 39000,
        9: 68000,
        10: 74000
    };

    // Gekozen juwelen ophalen
    const gekozen = JSON.parse(localStorage.getItem("juwelenSlots")) || [];

    // Totaal berekenen
    let totaal = 0;
    gekozen.forEach(juweelId => {
        if(juweelId !== null){
            totaal += juweelWaarden[juweelId];
        }
    });

    // Tijd berekenen
    const startTime = localStorage.getItem('startTime');
    let tijdTekst = '';
    if(startTime){
        const eindTime = Date.now();
        const diff = eindTime - startTime; // in milliseconds

        const seconden = Math.floor(diff / 1000) % 60;
        const minuten = Math.floor(diff / (1000 * 60)) % 60;
        const uren = Math.floor(diff / (1000 * 60 * 60));

        tijdTekst = `<p>Je deed er ${uren} uur, ${minuten} min, ${seconden} sec over!</p>`;
    }

    // Toon totaal + tijd
    document.getElementById("totaal").innerHTML = `
        <h1>Gefeliciteerd!</h1>
        <p>Je hebt een totaal van €${totaal} buitgemaakt!</p>
        ${tijdTekst}
    `;
</script>

</html>
