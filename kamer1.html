<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/garagedicht.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        .lock-icon {
    position: absolute;
    bottom: 5px;          /* afstand van onderkant */
    left: 50%;
    transform: translateX(-50%);
    width: 80px;           /* pas dit aan als je 'm iets groter/kleiner wilt */
    opacity: 0.9;          /* optioneel: iets mysterieus */
}

.center-box {
    width: 80px;          /* zelfde grootte als de lock */
    position: absolute;
    top: 50%;
    left: 95%;
    transform: translate(-50%, -50%);
    opacity: 0.95;        /* subtiel effect */
}

.letter-stack {
    position: absolute;
    top: 75%;           /* midden van scherm */
    left: 2.5%;
    transform: translate(-50%, -130%); /* boven de box positioneren */
    display: flex;
    flex-direction: column;
    gap: 5px;           /* afstand tussen letters */
}

.letter-stack img {
    width: 25px;       /* helft van de originele grootte */
    opacity: 0.95;
}

    </style>
</head>
<body>

<div class="letter-stack">
    <img src="img/K.png" alt="K">
    <img src="img/E.png" alt="E">
    <img src="img/L.png" alt="L">
    <img src="img/L.png" alt="L">
    <img src="img/Y.png" alt="Y">
</div>

<img src="img/box.webp" alt="Box" class="center-box">
<img src="img/lock.png" alt="Lock" class="lock-icon">


</body>
</html>
