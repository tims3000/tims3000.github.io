<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room</title>

    <!-- Google Font voor mysterious vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: url('img/garagedicht.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 0 0 10px rgba(0,0,0,0.9);
        }

        .lock-icon {
    position: absolute;
    bottom: 5px;          /* afstand van onderkant */
    left: 50%;
    transform: translateX(-50%);
    width: 80px;           /* pas dit aan als je 'm iets groter/kleiner wilt */
    opacity: 0.9;          /* optioneel: iets mysterieus */
}

.center-box {
    width: 80px;          /* zelfde grootte als de lock */
    position: absolute;
    top: 50%;
    left: 95%;
    transform: translate(-50%, -50%);
    opacity: 0.95;        /* subtiel effect */
}

.letter-stack {
    position: absolute;
    top: 65%;           /* midden van scherm */
    left: 2.5%;
    transform: translate(-50%, -130%); /* boven de box positioneren */
    display: flex;
    flex-direction: column;
    gap: 5px;           /* afstand tussen letters */
}

.letter-stack img {
    width: 20px;       /* helft van de originele grootte */
    opacity: 0.95;
}

#poster {
    position: absolute;
    top: 50%;
    left: 2.5%;
    transform: translate(-50%, -50%);
    width: 120px;       /* pas aan naar wens */
    cursor: pointer;    /* geeft aan dat je erop kan klikken */
    z-index: 10;        /* boven de letters */
}


    </style>
</head>
<body>

    <!-- Poster die de letters bedekt -->
<img src="img/poster.jpeg" alt="Poster" id="poster">


<div class="letter-stack">
    <img src="img/K.png" alt="K">
    <img src="img/E.png" alt="E">
    <img src="img/L.png" alt="L">
    <img src="img/L.png" alt="L">
    <img src="img/Y.png" alt="Y">
</div>

<img src="img/box.webp" alt="Box" class="center-box" id="box">
<img src="img/lock.png" alt="Lock" class="lock-icon" id="lock">,


<script>
    // Check of speler al een sleutel heeft
    const Key = () => localStorage.getItem("Key") === "true";

        // Poster click
    const poster = document.getElementById("poster");
    poster.addEventListener("click", () => {
        poster.style.display = "none"; // poster verdwijnt
    });

    // BOX CLICK
    document.getElementById("box").addEventListener("click", () => {
        if (Key()) {
            alert("De box is al leeg. Je hebt de sleutel al 🔑");
            return;
        }

        const code = prompt("Voer de code in om de box te openen en de sleutel te krijgen:");

        if (!code) return;

        if (code.toLowerCase() === "kelly") {
            localStorage.setItem("Key", "true");
            alert("✔️ Juist! Je hebt een sleutel gevonden 🔑");
        } else {
            alert("❌ Verkeerde code. De box blijft dicht.");
        }
    });

    // LOCK CLICK
    document.getElementById("lock").addEventListener("click", () => {
        if (!Key()) {
            alert("🔒 De deur zit op slot. Je hebt een sleutel nodig.");
        } else {
            window.location.href = "garage.html"; // volgende pagina
        }
    });
</script>


</body>
</html>
